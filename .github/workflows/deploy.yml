name: Build, validate, and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: CTF smoke tests
        run: npm run ctf:smoke

      - name: Autonomous solver smoke tests
        run: npm run ctf:autonomous:smoke

      - name: Research smoke tests
        run: npm run ctf:research:smoke

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_CTF_URL: ""

  deploy:
    name: Trigger deployment
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger deploy hook
        if: env.DEPLOY_HOOK_URL != ''
        run: |
          curl --fail --silent --show-error --retry 3 \
            --request POST "$DEPLOY_HOOK_URL"
          echo "Deploy hook dipanggil."

      - name: No deploy hook configured
        if: env.DEPLOY_HOOK_URL == ''
        run: |
          echo "DEPLOY_HOOK_URL belum diatur."
          echo "Build sudah tervalidasi; deployment otomatis dilewati."
